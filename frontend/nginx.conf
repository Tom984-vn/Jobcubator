server {
    listen 80;
    
    # Đường dẫn tới thư mục chứa code React đã build (trong container)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 🔥 QUAN TRỌNG: Kiểm tra file tồn tại -> nếu không thì trả về index.html
        # Để React Router tự xử lý routing ở phía client
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cache cho file tĩnh (tùy chọn để web nhanh hơn)
    location ~* \.(?:css|js|jpg|svg|png|ico|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }
}