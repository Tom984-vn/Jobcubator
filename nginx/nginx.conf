events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 1. Frontend: Mặc định vào React
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

        }

        # 2. Backend API: Những gì bắt đầu bằng /api/
        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. WebSocket Chat: Cần thiết để realtime hoạt động
        location /ws-chat {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # 4. MinIO (Xử lý đường dẫn tương đối để fix lỗi ảnh)
        location /minio/ {
            rewrite ^/minio/(.*) /$1 break;
            proxy_pass http://minio:9000;
            proxy_set_header Host minio:9000;
        }

        location /ai/ {
            # Chuyển hướng /ai/general -> http://ai-service:3000/general
            # Dấu / ở cuối http://ai-service:3000/ là để Nginx bỏ chữ /ai đi
            proxy_pass http://ai-service:3000/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 🔥 QUAN TRỌNG NHẤT: Tắt đệm để Streaming hoạt động
            proxy_buffering off;
            
            # Tăng timeout nếu AI suy nghĩ lâu
            proxy_read_timeout 300s;
            
            # Hỗ trợ SSE (Server Sent Events) nếu cần
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }
    }
}
